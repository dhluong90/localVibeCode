[project]
name = "localvibecode"
version = "0.2.0"
description = "Enterprise Local Vibe Coding Engine (100% Offline • Graphify AST • PEV Loop • MCP Server)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "dhluong90" }
]
keywords = [
  "vibe-coding",
  "local-llm",
  "ollama",
  "offline",
  "air-gapped",
  "mcp",
  "tree-sitter",
  "ast",
  "code-graph",
  "ai-assisted-engineering"
]
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.scripts]
localvibecode = "localvibecode.cli:main"
lvc = "localvibecode.cli:main"
localvibecode-mcp = "localvibecode.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
